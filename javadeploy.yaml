
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java
spec:
  replicas: 3
  selector:
    matchLabels:
      app: java
  template:
    metadata:
      labels:
        app: java
    spec:
      containers:
        - name: java
          image: bussiness-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mariadb://mariadb-service:3306/businessdb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "businessapp"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: java-service
spec:
  selector:
    app: java
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP

